services:
  - type: web
    name: shicai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: AKSHARE_PYTHON
        value: /usr/bin/python3
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AI_CONFIG_SECRET
        generateValue: true
    disk:
      name: shicai-data
      mountPath: /app/data
      sizeGB: 1
